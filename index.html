<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拾线铺 · Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#f6ead8;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#4a3426;overflow:hidden}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
canvas{display:block;width:100%;flex:1;touch-action:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-weight:700}
.pill{background:linear-gradient(#fffdf6,#f2ddb8);border:2px solid #c8912f;border-radius:20px;padding:4px 12px;font-size:14px;box-shadow:0 2px 0 #d8bf9c,inset 0 -2px 3px rgba(200,145,47,.18)}
.bar{display:flex;gap:10px;justify-content:center;padding:8px 0 14px}
.tool{position:relative;width:64px;height:64px;border-radius:18px;background:linear-gradient(#fffdf6,#f2ddb8);border:2px solid #c8912f;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #b98a3a,0 6px 12px rgba(60,35,18,.18)}
.tool small{font-size:11px;font-weight:700;margin-top:2px}
.tool img{width:34px;height:34px;display:block;object-fit:contain}
.tool i{position:absolute;top:-6px;right:-6px;font-style:normal;background:#e85d5d;color:#fff;font-size:11px;border-radius:10px;padding:1px 6px}
.tool.ad i{background:#4a90d9}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 #b98a3a}
.mask{position:absolute;inset:0;background:rgba(60,40,25,.55);display:none;align-items:center;justify-content:center;z-index:10}
.mask.on{display:flex}
.card{width:84%;background:#fff8ee;border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-size:22px;margin-bottom:8px}
.card p{font-size:14px;line-height:1.6;margin:6px 0;color:#6b5040}
.btn{display:block;width:100%;margin-top:10px;padding:12px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:#e8834a;box-shadow:0 4px 0 #b8602e}
.btn.blue{background:#4a90d9;box-shadow:0 4px 0 #2f6aa8}
.btn.gray{background:#b9a690;box-shadow:0 4px 0 #8f7d68}
.btn:active{transform:translateY(2px)}
.story{background:#f3e3cc;border-radius:12px;padding:10px;margin-top:10px;text-align:left;font-size:13px;line-height:1.7}
.story b{color:#c0582a}
#shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
#shop div{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#e8e0d6;filter:grayscale(1);opacity:.45;transition:.4s}
#shop div.on{filter:none;opacity:1;background:#ffe9c7;transform:scale(1.05)}
#orders{display:flex;gap:8px;padding:2px 10px 0;min-height:52px}
.ord{flex:1;display:flex;align-items:center;gap:6px;background:#fff8ee;border:2px solid #e4cfb2;border-radius:14px;padding:4px 8px;transition:.25s}
.ord .gst{font-size:26px}
.ord .body{flex:1;display:flex;flex-direction:column;gap:3px}
.ord .need{display:flex;gap:6px;flex-wrap:wrap}
.ord .pat{height:5px;background:#eadbc6;border-radius:3px;overflow:hidden}
.ord .pat i{display:block;height:100%;transition:width .2s}
.ord.gone{opacity:.5;background:#f6dede;border-color:#e5a3a3}
.ord .it{font-size:20px;display:flex;align-items:center;gap:2px}
.ord .it b{font-size:12px;color:#8a6a50}
.ord .rw{font-size:12px;font-weight:700;color:#c0812a}
.ord.hit{transform:scale(1.06);border-color:#f2b134;background:#fff1c9}
.ord.done{opacity:.55;background:#e6f4e2;border-color:#9fd09a}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(60,40,25,.85);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span class="pill" id="lvTxt">第 1 关</span><span class="pill" id="leftTxt">剩 0</span><span class="pill">⭐ <b id="starTxt">0</b> · 💰 <b id="coinTxt">0</b></span></div>
  <canvas id="cv"></canvas>
  <div class="bar">
    <div class="tool" id="tShake"><img class="ico" id="iShake" alt="抖篮"><small>抖篮</small><i>1</i></div>
    <div class="tool" id="tBack"><img class="ico" id="iBack" alt="退回"><small>退回</small><i>1</i></div>
    <div class="tool" id="tPeek"><img class="ico" id="iPeek" alt="透视"><small>透视</small><i>1</i></div>
    <div class="tool" id="tShop"><img class="ico" id="iShop" alt="线铺"><small>线铺</small></div>
  </div>
  <div class="mask" id="mask"><div class="card" id="card"></div></div>
  <div class="toast" id="toast"></div>
</div>

/* ---------- 遮挡判定：自由散落，圆形重叠 + 高层压低层 ---------- */
// tile: x,y ∈ [0,1]（筐内归一化坐标），r 归一化半径，rot 旋转，z 层
function overlap(a,b){ const dx=a.x-b.x, dy=a.y-b.y, k=(a.r+b.r)*.82; return dx*dx+dy*dy < k*k; }
function isCovered(t, list){ for(const o of list){ if(o!==t && o.alive && o.z>t.z && overlap(o,t)) return true; } return false; }
// 退回 / 复活：把物件撒回筐顶
function pushBack(list, colors){
  const top = list.reduce((m,t)=>Math.max(m,t.z),0)+1, r = list[0] ? list[0].r : .08;
  colors.forEach((c,i)=>list.push({x:.3+i*.2, y:.18+(i%2)*.05, r, rot:(i-1)*.4, z:top, alive:true, color:c, id:list.length}));
}

/* ---------- 生成：先摆位置 → 模拟一条"合法拾取序列" → 按序列分配颜色（保证有解） ---------- */
function genLevel(lv){
  const P = LEVELS[Math.min(lv, LEVELS.length) - 1];
  const total = P.triples * 3;
  for(let attempt=0; attempt<200; attempt++){
    seed = lv*7919 + attempt*104729 + 13;
    // 1) 自由散落成"一座小山"：中心高、边缘低，随机旋转 —— 像真的倒了一筐东西
    const tiles = [];
    const r0 = .095 - Math.min(.035, total*.0005);
    for(let i=0;i<total;i++){
      const z = Math.floor(i * P.layers / total);           // 层号（越后越高）
      const spread = .46 - z/P.layers*.22;                   // 高层更集中在中间 → 堆成小山
      const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*spread;
      tiles.push({x:.5+Math.cos(a)*d, y:.52+Math.sin(a)*d*.78, r:r0*(.9+rnd()*.25), rot:(rnd()-.5)*1.4, z, alive:true, color:-1, id:i});
    }
    if(tiles.length !== total){ if(typeof DBG!=="undefined") DBG.layout++; continue; }
    // 2) 模拟拾取顺序：每步从"当前未被遮挡"的格子里随机取一个
    const order = [];
    while(order.length < total){
      const free = tiles.filter(t => t.alive && !isCovered(t, tiles));
      if(!free.length) break;
      const t = free[Math.floor(rnd()*free.length)];
      t.alive = false; order.push(t);
    }
    if(order.length !== total) continue;
    // 3) 颜色序列：triples 组按色循环，再做窗口内交错（mix 越大越乱）
    // 构造式颜色序列：模拟线篮，保证"按 order 拾取"时篮内峰值 ≤ LIMIT（必有解）
    const LIMIT = SLOT_N - 1;
    const remain = []; for(let i=0;i<P.triples;i++){ const col=i%P.colors; remain[col]=(remain[col]||0)+3; }
    const seq = []; const open = {}; let inSlot = 0, peak = 0, ok = true;
    for(let k=0;k<total;k++){
      const openCols = Object.keys(open).map(Number).filter(c=>open[c]>0);
      const fresh = remain.map((v,c)=>c).filter(c=>remain[c]>0 && !(open[c]>0));
      // mix 越大，越倾向开新色（篮子越挤）；篮满前强制补齐已开色
      const canOpen = fresh.length && inSlot + 3 <= LIMIT; // 开新色后最坏再补 2 个即可凑齐
      const pOpen = openCols.length ? Math.min(.85, .15 + P.mix*.14) : 1;
      let col;
      if(canOpen && (rnd() < pOpen || !openCols.length)) col = fresh[Math.floor(rnd()*fresh.length)];
      else if(openCols.length){ openCols.sort((a,b)=>open[b]-open[a]); col = (inSlot + 2 > LIMIT || rnd()<.5) ? openCols[0] : openCols[Math.floor(rnd()*openCols.length)]; }
      else { ok=false; break; }
      seq.push(col); remain[col]--; open[col]=(open[col]||0)+1; inSlot++;
      peak = Math.max(peak, inSlot);
      if(open[col]===3){ open[col]=0; inSlot-=3; }
    }
    if(!ok || peak > LIMIT){ if(typeof DBG!=="undefined") DBG.color++; continue; }
    order.forEach((t,i)=>{ t.color = seq[i]; });
    tiles.forEach(t => t.alive = true);
    return {tiles, P, attempt, peak};
  }
  throw new Error("genLevel failed " + lv);
}

  const iw=img.width, ih=img.height, s=Math.max(w/iw, h/ih), dw=iw*s, dh=ih*s;

      ctx.strokeStyle="rgba(242,177,52,.95)"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(r.x+r.s/2, r.y+r.s/2, pr, 0, 7); ctx.stroke(); }
    drawItem(r.x,r.y,r.s,t.color, cov && peekT<=0, t.rot);
  }
  ctx.restore();
  drawCat(now);
  // 线篮
  const danger = slot.length >= slotCap-2;
  const s0 = slotRect(0);
  const tg = ctx.createLinearGradient(0, slotY-8, 0, slotY+s0.s+8);
  tg.addColorStop(0, danger ? "#7a4a2e" : "#5e3a20"); tg.addColorStop(1, danger ? "#54290f" : "#3a2210");
  ctx.fillStyle = tg; roundRect(s0.x-8, slotY-8, slotW+16, s0.s+16, 18); ctx.fill();
  ctx.strokeStyle = danger ? "#e8604a" : "#c8912f"; ctx.lineWidth=3; ctx.stroke();
  for(let i=0;i<SLOT_MAX;i++){ const r=slotRect(i);
    if(i<slotCap){ ctx.fillStyle = (i===slotCap-1 && slotFlash>now) ? "#ffe08a" : "#fbf1e2"; roundRect(r.x+3,r.y+3,r.s-6,r.s-6,10); ctx.fill(); }
    else { ctx.fillStyle="rgba(120,90,60,.18)"; roundRect(r.x+3,r.y+3,r.s-6,r.s-6,10); ctx.fill();
      ctx.font=(r.s*.36)+"px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.globalAlpha=.55; ctx.fillText("🔒",r.x+r.s/2,r.y+r.s/2); ctx.globalAlpha=1; } }
  slot.forEach((it,i)=>{ const r=slotRect(i); it.dx += (r.x-it.dx)*.35; drawItem(it.dx+3,r.y+3,r.s-6,it.color,false,0); });
  // 飞行中
  for(let i=flying.length-1;i>=0;i--){
    const f=flying[i]; f.t=Math.min(1,f.t+.12);
    const e = 1-Math.pow(1-f.t,3), x=f.x0+(f.x1-f.x0)*e, y=f.y0+(f.y1-f.y0)*e - Math.sin(e*Math.PI)*40;
    const s=f.s0+(f.s1-f.s0)*e; drawItem(x,y,s,f.color,false,f.rot*(1-e));
    if(f.t>=1){ flying.splice(i,1); f.done(); }
  }
  // 交付：收好的物件飞向客人
  for(let i=deliverFx.length-1;i>=0;i--){ const d=deliverFx[i], e=(now-d.t0)/450; if(e<0) continue;
    if(e>=1){ deliverFx.splice(i,1); burst(d.x1,d.y1,COLORS[d.c].c); continue; }
    const k=1-Math.pow(1-e,2), x=d.x0+(d.x1-d.x0)*k, y=d.y0+(d.y1-d.y0)*k - Math.sin(e*Math.PI)*60;
    drawItem(x-14,y-14,28*(1-e*.3),d.c,false,e*6); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i], e=(now-f.t0)/1400; if(e>=1){ floats.splice(i,1); continue; }
    ctx.globalAlpha=1-e; ctx.font="bold 15px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.lineWidth=4; ctx.strokeStyle="#fff"; ctx.strokeText(f.s,Math.min(W-80,Math.max(80,f.x)),f.y+40-e*30);
    ctx.fillStyle="#c0582a"; ctx.fillText(f.s,Math.min(W-80,Math.max(80,f.x)),f.y+40-e*30); ctx.globalAlpha=1; }
  // 特效粒子
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.25; p.life-=.03;
    ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1; if(p.life<=0) fx.splice(i,1); }
  // 最后一击预警：篮将满 → 全屏红脉冲边框（输不再突兀）
  if(slot.length >= slotCap-1){
    const a = .14 + .14*Math.abs(Math.sin(now/170));
    ctx.save(); ctx.strokeStyle=`rgba(217,83,79,${a})`; ctx.lineWidth=12; ctx.strokeRect(6,6,W-12,H-12);
    const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75); vg.addColorStop(0,"rgba(217,83,79,0)"); vg.addColorStop(1,`rgba(217,83,79,${a*.7})`);
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  if(peekT>0) peekT--;
  requestAnimationFrame(draw);
}

/* ---------- 交互 ---------- */
let busy=false;
cv.addEventListener("pointerdown", e=>{
  if(state!=="play" || busy) return;
  const b=cv.getBoundingClientRect(), x=e.clientX-b.left, y=e.clientY-b.top;
  const cand = tiles.filter(t=>t.alive).sort((a,b)=>b.z-a.z);
  for(const t of cand){
    const r=tileRect(t);
    const dx=x-(r.x+r.s/2), dy=y-(r.y+r.s/2);
    if(dx*dx+dy*dy <= (r.s*.5)*(r.s*.5)){
      if(isCovered(t,tiles)){ toast("被压住了，先拿上面的"); cat("start"); beep(180,.08,"square",.05); return; }
      pick(t,r); return;
    }
  }
});
function pick(t,r){
  if(slot.length + flying.length >= slotCap) return;
  t.alive=false; SFX.pick(); vibrate(8); tickOrders();
  // 同色插到同色后面（抓大鹅式归堆）
  let idx = slot.length; for(let i=slot.length-1;i>=0;i--) if(slot[i].color===t.color){ idx=i+1; break; }
  const target = slotRect(idx);
  busy=true;
  flying.push({x0:r.x,y0:r.y,s0:r.s,x1:target.x+3,y1:target.y+3,s1:target.s-6,color:t.color,rot:t.rot,t:0,done(){
    slot.splice(idx,0,{color:t.color, dx:target.x});
    busy=false; resolve();
  }});
  updateHUD();
}
function resolve(){
  // 三消
  const cnt={}; slot.forEach(s=>cnt[s.color]=(cnt[s.color]||0)+1);
  for(const c in cnt){ if(cnt[c]>=3){
    let removed=0; const rs=[];
    slot = slot.filter((s,i)=>{ if(s.color==c && removed<3){ removed++; rs.push(slotRect(i)); return false; } return true; });
    rs.forEach(r=>burst(r.x+r.s/2,r.y+r.s/2,COLORS[c].c));
    deliver(c, rs);
    combo++; SFX.match(combo); vibrate(20); if(combo>=2) cat("combo");
    if(combo>=2) toast(["","","连消 ×2！","手感火热 ×3！","停不下来 ×4！","织神附体 ×"+combo+"！"][Math.min(combo,5)]);
  }}
  if(!tiles.some(t=>t.alive) && !slot.length){ return setTimeout(win,350); }
  if(slot.length>=slotCap){ return setTimeout(lose,250); }
  const dangerN = slotCap - slot.length;                       // 剩余空格
  if(dangerN<=2){ SFX.warn(); vibrate(30); cat("danger"); }
  if(dangerN===1){ toast("⚠️ 篮只剩 1 格！用「退回」或「抖篮」挪一挪"); shakeT=Math.max(shakeT,.5); }  // 最后一击预警
  if(!Object.values(cnt).some(v=>v>=3)) combo=0;
  updateHUD();
}
let combo=0, slotCap=SLOT_N, slotFlash=0;
function burst(x,y,c){ for(let i=0;i<14;i++){ const a=Math.random()*7, v=2+Math.random()*4; fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:2+Math.random()*3,c,life:1}); } }

/* ---------- 订单 v3：客人"站进"场景 ----------
   客人站在筐上方的柜台前，头顶气泡点单 + 耐心环；收好的物件会真的飞到客人手里；
   客人会催、会道谢、会摔门走，黑猫会幸灾乐祸。筐里客人要的东西带金圈提示。
   规则不变：每拿 1 件耐心 -1；交单 → 线篮 +1 格（上限 SLOT_MAX）+ 金币。 */
// 普通客人（循环出场）
const GUESTS = [
  {ico:"👵",n:"奶奶",img:"granny"},{ico:"👧",n:"小花",img:"girl"},{ico:"🧔",n:"木匠",img:"carpenter"},{ico:"👩‍🍳",n:"厨娘",img:"cook"},
  {ico:"👮",n:"巡警",img:"police"},{ico:"👴",n:"老邮差",img:"postman"}
];
// 特殊客人：VIP（斗篷客，重赏短耐心）/ 黑猫假扮（陷阱，喂它就偷格子）
const VIP_GUEST = {ico:"🧙",n:"斗篷客",kind:"vip",img:"cloak"};
const CAT_GUEST  = {ico:"😼",n:"神秘客",kind:"imposter",img:"cat"};
const IMPOSTOR_SAY = ["喵（咳）…我是来买东西的！","快给我，别问那么多","嘻…这颜色归我了","别老盯着我的尾巴看"];
// 剧情串联：小花是跨关回访的常客，在 3/5/7/9 关必出现，完成她订单→故事+1、额外金币
const XH_LEVELS = [3,5,7,9];
const XH_LINES = [
  "小花：上次那团线，我织成围巾啦！",
  "小花：奶奶说你手艺越来越好了～",
  "小花：镇上的灰雾，好像淡了一点点。",
  "小花：等我长大，也要来帮你守铺子！"
];
let orders = [], orderDone = 0, orderLost = 0, coinsGot = 0, guestIdx = 0, deliverFx = [];
const SEATS = ()=> level===1 ? 1 : 2;
const pick1 = a => a[Math.floor(Math.random()*a.length)];

function remainCount(){ const h={}; tiles.forEach(t=>{ if(t.alive) h[t.color]=(h[t.color]||0)+1; }); slot.forEach(s=>h[s.color]=(h[s.color]||0)+1); return h; }
function guestSay(o, txt, ms){ o.say = txt; o.sayUntil = performance.now() + (ms||1800); }
// 特殊客人是"风险/收益"旋钮：VIP 给高价值短耐心，黑猫假扮是陷阱
function rollKind(){
  if(level>=4 && Math.random()<0.18) return "imposter";
  if(level>=3 && Math.random()<0.28) return "vip";
  return "normal";
}
function newOrder(seat){
  const have = remainCount(), busyC = new Set(orders.filter(o=>!o.done&&!o.gone).flatMap(o=>o.need.map(x=>x.c)));
  const cols = Object.keys(have).map(Number).filter(c=>have[c]>=3 && !busyC.has(c)).sort(()=>Math.random()-.5);
  if(!cols.length) return null;
  const kinds = level<=2 ? 1 : (Math.random()<.45 && cols.length>1 ? 2 : 1);
  const need = cols.slice(0,kinds).map(c=>({c, want: Math.min(Math.floor(have[c]/3), Math.random()<.3?2:1), got:0}));
  const sets = need.reduce((s,x)=>s+x.want,0);
  // 小花（常客）在剧情关必出现在座位0；否则按风险/收益掷特殊客人
  let g, kind="normal";
  if(seat===0 && XH_LEVELS.includes(level) && !orders.some(o=>o.regular)){ g = GUESTS[1]; kind="regular"; }
  else { const rk = rollKind(); kind = rk;
    g = rk==="vip" ? VIP_GUEST : rk==="imposter" ? CAT_GUEST : GUESTS[guestIdx++ % GUESTS.length]; }
  let pat = Math.round(sets*11 + 8 - Math.min(4, level*.4));   // 耐心 = 拿取次数（sim3 调参：11/8）
  let reward = 8 + sets*10;
  if(g.kind==="vip"){ pat = Math.max(4, Math.round(pat*0.5)); reward = reward*3; }   // VIP：赏金×3、耐心减半
  const o = {g, kind:g.kind||kind, regular: kind==="regular", need, seat, done:false, gone:false, pat, max:pat, reward,
             enter: performance.now(), leaveAt: 0, bump: 0, urged:false, say:"", sayUntil:0};
  guestSay(o, g.kind==="imposter" ? pick1(IMPOSTOR_SAY) : ITEM_WHY[need[0].c] + "，要" + ITEM_NAMES[need[0].c] + "！", 2600);
  return o;
}
function freeSeat(){ const used = new Set(orders.map(o=>o.seat)); for(let i=0;i<SEATS();i++) if(!used.has(i)) return i; return -1; }
function makeOrders(){
  orders=[]; deliverFx=[]; orderDone=0; orderLost=0; coinsGot=0; guestIdx=level*2;
  for(let i=0;i<SEATS();i++){ const o=newOrder(i); if(o) orders.push(o); }
}
function refillOrders(){
  orders = orders.filter(o=>!o.done && !o.gone);
  let s; while((s=freeSeat())>=0){ const o=newOrder(s); if(!o) break; orders.push(o); }
}
function renderOrders(){}   // 兼容旧调用：订单已改为画布内绘制

// 客人想要、且还没凑齐的物件颜色（用于筐内金圈提示）
function wantedSet(){ const w={}; orders.forEach(o=>{ if(!o.done&&!o.gone) o.need.forEach(x=>{ if(x.got<x.want) w[x.c]=1; }); }); return w; }

// 每拿一件：耐心 -1；快没耐心时催一句；耗尽就摔门走
function tickOrders(){
  let changed=false;
  for(const o of orders){
    if(o.done||o.gone) continue;
    o.pat--;
    if(!o.urged && o.pat/o.max <= .3){ o.urged=true; guestSay(o, pick1(GUEST_LINES.urgent), 1600); beep(330,.1,"square",.06); }
    if(o.pat<=0){
      o.gone=true; o.leaveAt=performance.now(); orderLost++; changed=true;
      guestSay(o, pick1(GUEST_LINES.leave), 1400); cat("guestGone");
      beep(220,.25,"triangle",.1,150); vibrate(40);
    }
  }
  if(changed) setTimeout(refillOrders,1000);
}
// 三消时：物件真的飞到客人手里
function deliver(c, fromRects){
  for(const o of orders){
    if(o.done||o.gone) continue;
    const n = o.need.find(x=>x.c==c && x.got<x.want); if(!n) continue;
    n.got++; o.bump = performance.now()+300;
    const G = guestPos(o), now = performance.now();
    (fromRects||[]).forEach((r,k)=>deliverFx.push({x0:r.x+r.s/2, y0:r.y+r.s/2, x1:G.x, y1:G.y, c, t0: now + k*70, o}));
    if(o.need.every(x=>x.got>=x.want)){
      o.done=true; o.leaveAt=now+450; orderDone++;
      if(o.kind==="imposter"){ imposterReveal(o); setTimeout(refillOrders,1300); return true; }   // 黑猫假扮：喂它就是上当
      coinsGot+=o.reward;
      if(o.regular){ save.xiaohua=(save.xiaohua||0)+1; persist(); const b=8; coinsGot+=b; floatTxt(G.x,G.y-30,"🌸 小花 +"+b); toast("🌸 小花的故事 +1（"+(save.xiaohua)+"/"+XH_LEVELS.length+"）"); }
      const grow = slotCap < SLOT_MAX; if(grow) slotCap++;
      setTimeout(()=>{
        const thx = o.regular ? (XH_LINES[Math.min((save.xiaohua||1)-1, XH_LINES.length-1)]||"小花：又见面啦～") : pick1(GUEST_LINES.thanks);
        guestSay(o, thx, 1600);
        [784,988,1318].forEach((f,k)=>setTimeout(()=>beep(f,.16,"triangle",.16),k*80));
        vibrate([15,30,15]);
        // 局内回报：每完成一单，线篮 +1 格（上限 SLOT_MAX）—— 让"做订单"从陷阱变成保命投资
        let gift = "";
        if(grow){ slotFlash = performance.now()+1400; gift = "  🧺 篮子+1格"; }
        floatTxt(G.x, G.y-30, "💰+"+o.reward + (o.kind==="vip"?" ×3":"") + (o.regular?"  🌸":gift));
        if(Math.random()<.5) cat("guestDone");
      }, 420);
      setTimeout(refillOrders,1300);
    } else beep(1046,.12,"triangle",.14);
    return true;
  }
  return false;
}
// 黑猫假扮客人被"喂"了：现原形，偷走 1 格篮子（下限 SLOT_N），并嘲讽
function imposterReveal(o){
  const G = guestPos(o), stole = slotCap > SLOT_N;
  if(stole) slotCap = Math.max(SLOT_N, slotCap-1);
  cat("imposter");
  beep(160,.3,"sawtooth",.12,300);
  floatTxt(G.x, G.y-30, "😼 喵哈哈！");
  shakeT = Math.max(shakeT, .6);
  toast("😼 黑猫现原形！" + (stole ? "偷走了 1 格篮子！" : "（篮子已最小）"));
}
let floats=[];
function floatTxt(x,y,s){ floats.push({x,y,s,t0:performance.now()}); }

/* ---------- 柜台 + 客人绘制（画布顶部 COUNTER_H 区域） ---------- */
const COUNTER_H = 118;
function guestPos(o){
  // 区间 [48, W-78]：左边是门，右边是黑猫；每个座位 = 客人头像 + 右侧需求牌
  const n = SEATS(), L = 48, span = (W - 78 - L)/n;
  return {x: L + span*o.seat + 30, y: 62};
}
function drawCounter(now){
  // 墙 + 柜台台面（墙用贴图，回退渐变）
  if(!cover(SPRITES.wall, 0, 0, W, COUNTER_H)){
    const prog = (save.bought?save.bought.length:0)/SHOP.length;
    const wg = ctx.createLinearGradient(0,0,0,COUNTER_H); wg.addColorStop(0, prog>.5?"#fff0d6":"#f3e2c7"); wg.addColorStop(1, prog>0?"#f0dcb8":"#e8d0ad");
    ctx.fillStyle = wg; ctx.fillRect(0,0,W,COUNTER_H);
  }
  ctx.fillStyle = "#b07a46"; ctx.fillRect(0,COUNTER_H-22,W,22);
  ctx.fillStyle = "#8a5a2c"; ctx.fillRect(0,COUNTER_H-6,W,6);
  ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(0,COUNTER_H-22,W,3);
  // 元叙事：修好的物件摆上柜台前脸，铺子随修复「变好看」
  const owns = save.bought||[];
  if(owns.length){
    const step = (W-44)/owns.length, sy = COUNTER_H-11;
    ctx.font='20px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign="center"; ctx.textBaseline="middle";
    owns.forEach((idx,i)=>{ const it=SHOP[idx]; if(!it) return; ctx.fillText(it.ico, 30+step*(i+.5), sy); });
  }
  // 门（客人从这里进出）
  ctx.fillStyle="#9c6b3d"; roundRect(8,8,34,COUNTER_H-30,6); ctx.fill();
  ctx.fillStyle="#f2b134"; ctx.beginPath(); ctx.arc(36,COUNTER_H/2-4,2.5,0,7); ctx.fill();
  for(const o of orders) drawGuest(o, now);
}
function drawGuest(o, now){
  const G = guestPos(o), p = Math.max(0, o.pat/o.max);
  // 入场：从门口走进来；离场：完成=开心跳走，气走=抖一下后走
  let x = G.x, y = G.y, alpha = 1;
  const ein = Math.min(1, (now - o.enter)/500); x = 30 + (G.x-30)*(1-Math.pow(1-ein,3));
  if((o.done||o.gone) && o.leaveAt && now > o.leaveAt){
    const e = Math.min(1,(now-o.leaveAt)/700); alpha = 1-e;
    if(o.done) y -= e*30; else x += Math.sin(now/30)*4*(1-e) - e*40;
  }
  if(alpha<=0) return;
  const angry = !o.done && !o.gone && p<=.3, bounce = Math.max(0, o.bump-now)/300;
  ctx.save(); ctx.globalAlpha = alpha;
  if(angry) x += Math.sin(now/45)*2;
  // 耐心环
  const R = 25;
  ctx.lineWidth = 5; ctx.strokeStyle="rgba(120,90,60,.2)"; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.stroke();
  if(!o.done && !o.gone){
    ctx.strokeStyle = o.kind==="vip" ? "#e0a93a" : p>.5?"#5fae6a":p>.3?"#f2b134":"#e85d5d";
    ctx.beginPath(); ctx.arc(x,y,R,-Math.PI/2,-Math.PI/2+Math.PI*2*p); ctx.stroke();
  }
  if(o.kind==="vip"){ ctx.fillStyle="rgba(224,169,58,.18)"; ctx.beginPath(); ctx.arc(x,y,R+5,0,7); ctx.fill(); }  // VIP 金光
  const sp = SPRITES[o.g.img];
  if(sp){
    const ps = 54 * (1 + bounce*.25);
    ctx.save(); ctx.beginPath(); ctx.arc(x, y+3, R-2, 0, 7); ctx.clip();
    ctx.drawImage(sp, x-ps/2, y+3-ps*0.45, ps, ps);
    ctx.restore();
    if(o.done){ ctx.fillStyle="rgba(90,180,90,.5)"; ctx.beginPath(); ctx.arc(x,y+3,R-2,0,7); ctx.fill(); }
    else if(o.gone){ ctx.fillStyle="rgba(180,80,80,.5)"; ctx.beginPath(); ctx.arc(x,y+3,R-2,0,7); ctx.fill(); }
  } else {
    ctx.fillStyle = o.done?"#e6f4e2":o.gone?"#f6dede":"#fff8ee"; ctx.beginPath(); ctx.arc(x,y,R-3,0,7); ctx.fill();
    const face = o.done?"😊":o.gone?"😤":angry?"😠":o.g.ico;
    ctx.font = `${Math.round(30*(1+bounce*.25))}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(face, x, y+2);
  }
  ctx.font="bold 11px sans-serif"; ctx.fillStyle="#6b4428"; ctx.fillText(o.g.n, x, y+R+9);
  if(o.kind==="vip"){ ctx.font="20px sans-serif"; ctx.fillText("👑", x, y-R-13); }   // VIP 皇冠
  // 需求牌：物件 + 进度（挂在客人左侧）
  if(!o.gone){
    const items = o.need, bw = 34*items.length+8, bx = x + R + 4, by = y-20;
    ctx.fillStyle = o.done?"#e6f4e2":"#fff"; roundRect(bx,by,bw,40,10); ctx.fill();
    if(o.kind==="imposter"){ ctx.setLineDash([4,3]); ctx.strokeStyle="#c0392b"; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.strokeStyle = angry?"#e85d5d":"#d8bf9c"; ctx.lineWidth=2; ctx.stroke(); }
    items.forEach((it,k)=>{
      const ix = bx+4+k*34;
      drawItem(ix, by+3, 24, it.c, false, 0);
      const ok = it.got>=it.want;
      ctx.font="bold 11px sans-serif"; ctx.fillStyle= ok?"#3d8549":"#8a6a50"; ctx.textAlign="left";
      ctx.textAlign="center"; ctx.fillText(ok?"✓":(it.got*3)+"/"+(it.want*3), ix+15, by+33);
    });
    if(!o.done){ const cx0 = bx+bw/2-10, cy0 = by-8;            // 画布自绘金币（不依赖 💰 字形）
      if(o.kind==="imposter"){ ctx.fillStyle="#c0392b"; ctx.beginPath(); ctx.arc(cx0,cy0,6,0,7); ctx.fill(); ctx.fillStyle="#fff"; ctx.font="bold 13px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("?",cx0,cy0+1); }
      else { ctx.fillStyle="#f2b134"; ctx.beginPath(); ctx.arc(cx0,cy0,5,0,7); ctx.fill(); ctx.strokeStyle="#c4861a"; ctx.lineWidth=1.5; ctx.stroke();
        ctx.font="bold 11px sans-serif"; ctx.fillStyle="#c0812a"; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillText(o.reward, cx0+8, cy0+1); } }
  }
  // 对白气泡（在客人上方）
  if(o.say && now < o.sayUntil){
    // 气泡限定在本座位区间内，字太长就缩字号 —— 两位客人的气泡不会互相压
    const n = SEATS(), L = 46, span = (W - 78 - L)/n, sL = L + span*o.seat, sR = sL + span - 4;
    let fs = 12; ctx.font="bold "+fs+"px sans-serif"; let tw = ctx.measureText(o.say).width+16;
    while(tw > sR-sL && fs > 9){ fs--; ctx.font="bold "+fs+"px sans-serif"; tw = ctx.measureText(o.say).width+14; }
    const bx = Math.max(sL, Math.min(sR-tw, x-tw/2)), by = 2;
    ctx.fillStyle = o.gone?"#ffe3e3":"#fff"; roundRect(bx,by,tw,22,11); ctx.fill();
    ctx.strokeStyle="#6b4428"; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle="#4a3426"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(o.say, bx+tw/2, by+11);
  }
  ctx.restore();
}

/* ---------- 流程：开局 / 胜 / 负 / 复活 / 广告占位 ---------- */
const mask=document.getElementById("mask"), card=document.getElementById("card");
function modal(html){ card.innerHTML=html; mask.classList.add("on"); }
function closeModal(){ mask.classList.remove("on"); }

function startLevel(lv){
  level = lv; const g = genLevel(lv); tiles = g.tiles; P = g.P;
  slot=[]; flying=[]; fx=[]; combo=0; slotCap=SLOT_N; slotFlash=0; revived=false; busy=false;
  tools = {shake:1, back:1, peek:1}; state="play";
  layout(); makeOrders(); renderOrders(); updateHUD(); closeModal();
  const T = TALES[(lv-1)%TALES.length];
  const hasVip = orders.some(o=>o.kind==="vip"), hasImp = orders.some(o=>o.kind==="imposter");
  const special = hasVip&&hasImp ? "🧙 斗篷客是贵客：赏金×3、耐心短，值得抢！😼 神秘客是黑猫假扮——别喂它，会偷 1 格篮子！"
    : hasVip ? "🧙 斗篷客是贵客：赏金×3、耐心短，值得抢！"
    : hasImp ? "😼 神秘客是黑猫假扮的——喂它订单会被偷走 1 格篮子，别上当！" : "";
  const xh = orders.some(o=>o.regular) ? "🌸 小花又来啦——帮她完成订单，故事会一点点连起来（已 "+(save.xiaohua||0)+"/"+4+"）。" : "";
  state="pause";
  modal(`<h2>📜 ${T.t}</h2><p>${T.s}</p>${lv===1?'<p style="font-size:13px">点最上面的东西放进篮子，<b>3 个一样的</b>就收好了。<br>篮子 7 格，<b>装满就输</b>。</p>':''}<div class="story">🔔 叮铃——${orders.map(o=>o.g.ico+' <b>'+o.g.n+'</b>：「'+ITEM_WHY[o.need[0].c]+'，要 '+o.need.map(x=>ITEMS[x.c]+'×'+(x.want*3)).join(' ')+'」').join('<br>')}<br><small>⏳ 每拿一件客人就更急一点；筐里<b style="color:#d99a1a">金圈</b>是客人要的。<b>交一单 = 篮子 +1 格</b>（最多 9 格）+ 金币！</small>${special?`<br><small style="color:#b8860b">${special}</small>`:''}${xh?`<br><small style="color:#c0582a">${xh}</small>`:''}</div><button class="btn" id="bGo">${lv===2?"⚠️ 我偏要试试":"开始收拾"}</button>`);
  document.getElementById("bGo").onclick = ()=>{ closeModal(); state="play"; cat("start"); };
}

function lose(){
  state="lose"; SFX.lose(); vibrate([60,40,60]); cat("lose");
  const left = tiles.filter(t=>t.alive).length;
  const coinCost = 40;
  modal(`<h2>😼 黑猫：${catSay}</h2><p>篮子满了……筐里只剩 <b>${left}</b> 件！</p>
    ${revived?"":`<button class="btn blue" id="bRev">▶ 看视频 · 清出 3 格继续</button>
    <button class="btn" id="bCoin">💰 花 ${coinCost} 金币 · 清出 3 格继续（有 ${save.coins}）</button>`}
    <button class="btn" id="bRetry">重新开始</button>
    <button class="btn gray" id="bShareL">喊朋友来帮我过</button>`);
  if(!revived){
    document.getElementById("bRev").onclick = ()=>fakeAd(()=>{ revived=true; state="play";
      const take=slot.splice(0,3); pushBack(tiles, take.map(s=>s.color));
      closeModal(); updateHUD(); toast("复活！再小心点～"); });
    document.getElementById("bCoin").onclick = ()=>{
      if(save.coins<coinCost) return toast("金币不够，多做订单或看视频吧");
      save.coins-=coinCost; revived=true; state="play"; persist();
      const take=slot.splice(0,3); pushBack(tiles, take.map(s=>s.color));
      closeModal(); updateHUD(); toast("💰 花 "+coinCost+" 金币续命！"); };
  }
  document.getElementById("bRetry").onclick = ()=>startLevel(level);
  document.getElementById("bShareL").onclick = ()=>share(`黑猫把我的筐弄乱了，《拾线铺》第${level}关只剩${left}件没收完！你能过吗？`);
}

function win(){
  state="win"; SFX.win(); vibrate([20,30,20,30,80]); cat("win");
  const gain = level===2 ? 3 : level===10 ? 4 : 1;
  const allOrd = orderLost===0 && orderDone>0;
  const bonus = allOrd ? 1 : 0;
  save.coins += coinsGot;
  save.stars += gain + bonus; const isNew = save.level===level; if(isNew) save.level = Math.min(LEVELS.length, level+1);
  persist(); updateHUD();
  for(let i=0;i<5;i++) setTimeout(()=>burst(W*(.2+Math.random()*.6), H*.3, COLORS[i%9].c), i*120);
  const brag = level===2 ? `<p>🏆 你超过了 <b>77%</b> 的织匠！</p>` : "";
  modal(`<h2>🎉 收拾完啦！</h2><p>😾 黑猫：${catSay}</p>${brag}<p>获得 ⭐ × ${gain+bonus}${level===10?"（Boss 奖励）":""}${bonus?"（零差评 +1）":""}</p><p>📋 完成订单 ${orderDone} 单${orderLost?` · 气走 ${orderLost} 位`:''} · 💰 +${coinsGot}</p>
    <button class="btn blue" id="bDbl">▶ 看视频 · 星星翻倍</button>
    <button class="btn" id="bShop">去线铺修东西 🏠</button>
    ${level<LEVELS.length?`<button class="btn gray" id="bNext">下一关</button>`:`<p>Demo 共 10 关，感谢试玩！</p>`}
    ${level===2?`<button class="btn gray" id="bShareW">炫耀一下</button>`:""}`);
  document.getElementById("bDbl").onclick = function(){ fakeAd(()=>{ save.stars+=gain; persist(); updateHUD(); this.remove(); toast("⭐ +"+gain); }); };
  document.getElementById("bShop").onclick = ()=>openShop();
  const n=document.getElementById("bNext"); if(n) n.onclick = ()=>startLevel(level+1);
  const sw=document.getElementById("bShareW"); if(sw) sw.onclick = ()=>share("《拾线铺》第2关只有23%的人能过，我过了！你来试试？");
}

// 广告占位：模拟 1.5 秒激励视频（接微信 wx.createRewardedVideoAd 时替换此函数）
function fakeAd(onReward){
  modal(`<h2>📺 广告播放中…</h2><p>（Demo 占位，1.5 秒后发放奖励）</p>`);
  setTimeout(()=>{ closeModal(); onReward(); }, 1500);
}
function adPrompt(text, onReward){
  const prev = state; state="pause";
  modal(`<h2>🎁 道具用完啦</h2><p>${text}</p><button class="btn blue" id="bAd">▶ 看视频领取</button><button class="btn" id="bCoin">💰 30 金币买 1 次（有 ${save.coins}）</button><button class="btn gray" id="bNo">算了</button>`);
  document.getElementById("bCoin").onclick = ()=>{ if(save.coins<30) return toast("金币不够，多做订单吧"); save.coins-=30; persist(); state=prev; closeModal(); onReward(); updateHUD(); };
  document.getElementById("bAd").onclick = ()=>fakeAd(()=>{ state=prev; onReward(); updateHUD(); });
  document.getElementById("bNo").onclick = ()=>{ state=prev; closeModal(); };
}
function share(text){
  const url = location.protocol.startsWith("http") ? location.href : "https://example.com/";
  try{ if(navigator.share){ navigator.share({title:"拾线铺", text, url}); return; } }catch(e){}
  try{ navigator.clipboard.writeText(text+" "+url); toast("已复制，去粘贴给朋友吧"); }catch(e){ toast(text); }
}

/* ---------- 线铺：修复 + 剧情（浪漫餐厅式元层） ---------- */
function openShop(){
  const prev = state; if(state==="play") state="pause";
  const nBought = save.bought.length;
  const next = SHOP.find((s,i)=>!save.bought.includes(i));
  const grid = SHOP.map((s,i)=>`<div class="${save.bought.includes(i)?"on":""}" title="${s.n}">${s.ico}</div>`).join("");
  const storyIdx = Math.floor(nBought/2) - 1;
  const story = storyIdx>=0 ? `<div class="story">${STORY[Math.min(storyIdx,STORY.length-1)]}</div>` : `<div class="story"><b>奶奶：</b>灰雾过后，铺子全褪了色。拿星星来，一件件修回来吧。</div>`;
  modal(`<h2>🏠 拾光线铺 <small style="font-size:13px">${nBought}/${SHOP.length}</small></h2>
    <div id="shop">${grid}</div>${story}
    ${next?`<button class="btn" id="bBuy">修复「${next.n}」 ⭐${next.cost}（有 ${save.stars}）</button>`:`<p>第一章全部修好啦！第二章敬请期待</p>`}
    <button class="btn gray" id="bBack">${prev==="win"?"下一关":"返回"}</button>`);
  const bb=document.getElementById("bBuy");
  if(bb) bb.onclick = ()=>{
    const i = SHOP.indexOf(next);
    if(save.stars < next.cost) return toast("星星不够，去过关吧～");
    save.stars -= next.cost; save.bought.push(i); persist(); updateHUD();
    [659,784,988].forEach((f,k)=>setTimeout(()=>beep(f,.15,"triangle",.14),k*90));
    const newStory = save.bought.length%2===0;
    openShop(); if(newStory) toast("📖 解锁新剧情！");
  };
  document.getElementById("bBack").onclick = ()=>{
    if(prev==="win" && level<LEVELS.length) return startLevel(level+1);
    if(prev==="win") return closeModal();
    state = prev==="pause"?"play":prev; closeModal();
  };
}

/* ---------- 每日签到（留存钩子） ---------- */
function dayKey(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function maybeCheckIn(cb){
  const today = dayKey();
  if(save.lastDay === today) return cb();                 // 今天已签到
  const y = new Date(); y.setDate(y.getDate()-1);
  const yk = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  save.streak = (save.lastDay===yk) ? (save.streak||0)+1 : 1;   // 连续天数
  save.lastDay = today;
  const reward = 20 + save.streak*5;                     // 连签越多越多
  save.coins += reward; persist(); updateHUD();
  modal(`<h2>📅 每日签到 · 第 ${save.streak} 天</h2><p>连续来铺子，灰雾都散得快些～</p><p>领取 💰 +${reward} 金币！${save.streak>=3?"<br><small style='color:#c0582a'>连签奖励已解锁，明天更多！</small>":""}</p><button class="btn" id="bCi">收下，开工</button>`);
  document.getElementById("bCi").onclick = ()=>{ closeModal(); cb(); };
}

/* ---------- 启动 ---------- */
window.addEventListener("load", ()=>{ maybeCheckIn(()=>{ startLevel(save.level); requestAnimationFrame(draw); }); });
