<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拾线铺 · Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#f6ead8;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#4a3426;overflow:hidden}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
canvas{display:block;width:100%;flex:1;touch-action:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-weight:700}
.pill{background:#fff8ee;border:2px solid #e4cfb2;border-radius:20px;padding:4px 12px;font-size:14px}
.bar{display:flex;gap:10px;justify-content:center;padding:8px 0 14px}
.tool{position:relative;width:64px;height:64px;border-radius:18px;background:#fff8ee;border:2px solid #e4cfb2;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #d8bf9c}
.tool small{font-size:11px;font-weight:700;margin-top:2px}
.tool i{position:absolute;top:-6px;right:-6px;font-style:normal;background:#e85d5d;color:#fff;font-size:11px;border-radius:10px;padding:1px 6px}
.tool.ad i{background:#4a90d9}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 #d8bf9c}
.mask{position:absolute;inset:0;background:rgba(60,40,25,.55);display:none;align-items:center;justify-content:center;z-index:10}
.mask.on{display:flex}
.card{width:84%;background:#fff8ee;border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-size:22px;margin-bottom:8px}
.card p{font-size:14px;line-height:1.6;margin:6px 0;color:#6b5040}
.btn{display:block;width:100%;margin-top:10px;padding:12px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:#e8834a;box-shadow:0 4px 0 #b8602e}
.btn.blue{background:#4a90d9;box-shadow:0 4px 0 #2f6aa8}

.story b{color:#c0582a}
#shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
#shop div{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#e8e0d6;filter:grayscale(1);opacity:.45;transition:.4s}
#shop div.on{filter:none;opacity:1;background:#ffe9c7;transform:scale(1.05)}
#orders{display:flex;gap:8px;padding:2px 10px 0;min-height:52px}
.ord{flex:1;display:flex;align-items:center;gap:6px;background:#fff8ee;border:2px solid #e4cfb2;border-radius:14px;padding:4px 8px;transition:.25s}
.ord .gst{font-size:26px}
.ord .body{flex:1;display:flex;flex-direction:column;gap:3px}
.ord .need{display:flex;gap:6px;flex-wrap:wrap}
.ord .pat{height:5px;background:#eadbc6;border-radius:3px;overflow:hidden}
.ord .pat i{display:block;height:100%;transition:width .2s}
.ord.gone{opacity:.5;background:#f6dede;border-color:#e5a3a3}
.ord .it{font-size:20px;display:flex;align-items:center;gap:2px}
.ord .it b{font-size:12px;color:#8a6a50}
.ord .rw{font-size:12px;font-weight:700;color:#c0812a}
.ord.hit{transform:scale(1.06);border-color:#f2b134;background:#fff1c9}
.ord.done{opacity:.55;background:#e6f4e2;border-color:#9fd09a}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(60,40,25,.85);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
</style>

<body>
<div id="app">
  <div class="top"><span class="pill" id="lvTxt">第 1 关</span><span class="pill" id="leftTxt">剩 0</span><span class="pill">⭐ <b id="starTxt">0</b> · 🪙 <b id="coinTxt">0</b></span></div>

  <div class="bar">
    <div class="tool" id="tShake">🧺<small>抖篮</small><i>1</i></div>

    <div class="tool" id="tPeek">👁️<small>透视</small><i>1</i></div>
    <div class="tool" id="tShop">🏠<small>线铺</small></div>
  </div>
  <div class="mask" id="mask"><div class="card" id="card"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
"use strict";
/* ====== 拾线铺 Demo：堆叠拾取 + 7 格线篮三消 + 线铺修复/剧情 ====== */
const COLORS = [
  {c:"#e85d5d",d:"#b83b3b",n:"红"},{c:"#4a90d9",d:"#2f6aa8",n:"蓝"},{c:"#f2b134",d:"#c4861a",n:"黄"},
  {c:"#5fae6a",d:"#3d8549",n:"绿"},{c:"#9b6fd0",d:"#7349a8",n:"紫"},{c:"#f08cb4",d:"#c9638c",n:"粉"},
  {c:"#3fbfbf",d:"#258f8f",n:"青"},{c:"#8a5a3c",d:"#603a22",n:"棕"},{c:"#ff8a3d",d:"#cc6420",n:"橙"},
  {c:"#7d8a99",d:"#55606d",n:"灰"}
];
// 关卡表：colors 颜色数, triples 组数(每组3个), layers 层数, mix 交错度(越大越难), cols/rows 网格
const LEVELS = [
  {colors:3, triples:4,  layers:2, mix:0, cols:4, rows:4},   // 1 教学必过
  {colors:9, triples:27, layers:6, mix:6, cols:6, rows:7},   // 2 卡点关（抓大鹅式）裸玩≈29%
  {colors:4, triples:8,  layers:3, mix:1, cols:5, rows:5},
  {colors:5, triples:11, layers:3, mix:2, cols:5, rows:6},
  {colors:6, triples:15, layers:4, mix:3, cols:6, rows:6},
  {colors:5, triples:12, layers:3, mix:2, cols:5, rows:6},
  {colors:7, triples:18, layers:4, mix:2, cols:6, rows:7},   // 7  ≈66%
  {colors:7, triples:20, layers:4, mix:4, cols:6, rows:7},   // 8  ≈80%（喘口气，体量更大）
  {colors:7, triples:21, layers:5, mix:4, cols:6, rows:7},   // 9  ≈53%
  {colors:9, triples:25, layers:6, mix:5, cols:6, rows:7}    // 10 章末 Boss ≈13%
];
const SLOT_N = 7;      // 开局线篮格数（生成器按 7 格保证有解）
const SLOT_MAX = 9;    // 完成订单每单 +1 格，上限 9
const SHOP = [
  {ico:"🪧",n:"招牌",cost:1},{ico:"🪑",n:"木椅",cost:1},{ico:"🧶",n:"线团架",cost:2},{ico:"🪟",n:"窗帘",cost:2},
  {ico:"🕯️",n:"烛台",cost:2},{ico:"🧵",n:"织机",cost:3},{ico:"🐈‍⬛",n:"猫窝",cost:3},{ico:"🖼️",n:"挂毯",cost:4}
];
const STORY = [
  "<b>奶奶：</b>孩子，灰雾把镇上的颜色都拆成了线……这间线铺，就交给你了。",
  "<b>奶奶：</b>织机还能转！只是……昨晚好像有只黑猫叼走了一团红线。",
  "<b>神秘客人：</b>（推门，斗篷上沾着灰雾）\"我要一条能挡住灰雾的围巾。三天后来取。\"",
  "<b>奶奶：</b>黑猫的窝里……怎么会有你爷爷当年的织针？<br><i>—— 第一章完 · 未完待续 ——</i>"
];

/* ---------- 存档（try/catch 防无痕模式） ---------- */
const SAVE_KEY = "shixianpu_demo_v1";
let save = {level:1, stars:0, coins:0, bought:[]};
try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if(s) save = Object.assign(save, s); }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ---------- 随机源 ---------- */
let seed = 1;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- 情境：具体物件（按形状认，不靠颜色）+ 每关一个"事故现场" ---------- */
const ITEMS = ["🧶","🧦","🧤","🧣","🎀","🧸","✂️","🧵","🧷","👒"];
const TALES = [
  {t:"黑猫打翻了针线筐", s:"奶奶刚出门，黑猫就把筐掀了……趁她回来前收拾好！"},
  {t:"赶集日大混乱", s:"客人把整筐货翻得乱七八糟，全镇只有 23% 的人收拾完过。"},
  {t:"晾线绳断了", s:"一阵风，刚晾好的线全掉进了筐里。"},
  {t:"奶奶的嫁妆箱", s:"翻出了几十年前的老物件，小心别弄坏。"},
  {t:"神秘客人的订单", s:"斗篷客要的东西全混在这一筐里了。"},
  {t:"雨夜漏水", s:"屋顶漏雨，赶紧把筐里的东西抢救出来！"},
  {t:"黑猫又来了", s:"它好像在筐底藏了什么东西……"},
  {t:"灰雾压境", s:"灰雾飘进铺子，东西都在褪色，快！"},
  {t:"织机大扫除", s:"织机底下扫出了一整筐零碎。"},
  {t:"黑猫的老巢", s:"终于找到黑猫的窝了，满满一筐偷来的东西！"}
];
const CAT_LINES = {
  start:["喵～这筐是我弄乱的","你收拾不完的喵","嘿嘿，慢慢找吧"],
  danger:["喵嘿嘿，要满咯！","快不行了吧～","再拿错一个试试？"],
  combo:["喵？！","运气好而已喵","哼……"],
  lose:["喵哈哈哈哈！","就这？","明天再来吧喵～"],
  win:["喵！？不可能！","下次没这么简单！","哼，算你厉害"]
};

/* ---------- 遮挡判定：自由散落，圆形重叠 + 高层压低层 ---------- */
// tile: x,y ∈ [0,1]（筐内归一化坐标），r 归一化半径，rot 旋转，z 层
function overlap(a,b){ const dx=a.x-b.x, dy=a.y-b.y, k=(a.r+b.r)*.82; return dx*dx+dy*dy < k*k; }
function isCovered(t, list){ for(const o of list){ if(o!==t && o.alive && o.z>t.z && overlap(o,t)) return true; } return false; }
// 退回 / 复活：把物件撒回筐顶
function pushBack(list, colors){
  const top = list.reduce((m,t)=>Math.max(m,t.z),0)+1, r = list[0] ? list[0].r : .08;
  colors.forEach((c,i)=>list.push({x:.3+i*.2, y:.18+(i%2)*.05, r, rot:(i-1)*.4, z:top, alive:true, color:c, id:list.length}));
}

/* ---------- 生成：先摆位置 → 模拟一条"合法拾取序列" → 按序列分配颜色（保证有解） ---------- */
function genLevel(lv){
  const P = LEVELS[Math.min(lv, LEVELS.length) - 1];
  const total = P.triples * 3;
  for(let attempt=0; attempt<200; attempt++){
    seed = lv*7919 + attempt*104729 + 13;
    // 1) 自由散落成"一座小山"：中心高、边缘低，随机旋转 —— 像真的倒了一筐东西
    const tiles = [];
    const r0 = .095 - Math.min(.035, total*.0005);
    for(let i=0;i<total;i++){
      const z = Math.floor(i * P.layers / total);           // 层号（越后越高）
      const spread = .46 - z/P.layers*.22;                   // 高层更集中在中间 → 堆成小山
      const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*spread;
      tiles.push({x:.5+Math.cos(a)*d, y:.52+Math.sin(a)*d*.78, r:r0*(.9+rnd()*.25), rot:(rnd()-.5)*1.4, z, alive:true, color:-1, id:i});
    }
    if(tiles.length !== total){ if(typeof DBG!=="undefined") DBG.layout++; continue; }
    // 2) 模拟拾取顺序：每步从"当前未被遮挡"的格子里随机取一个
    const order = [];
    while(order.length < total){
      const free = tiles.filter(t => t.alive && !isCovered(t, tiles));
      if(!free.length) break;
      const t = free[Math.floor(rnd()*free.length)];
      t.alive = false; order.push(t);
    }
    if(order.length !== total) continue;
    // 3) 颜色序列：triples 组按色循环，再做窗口内交错（mix 越大越乱）
    // 构造式颜色序列：模拟线篮，保证"按 order 拾取"时篮内峰值 ≤ LIMIT（必有解）
    const LIMIT = SLOT_N - 1;
    const remain = []; for(let i=0;i<P.triples;i++){ const col=i%P.colors; remain[col]=(remain[col]||0)+3; }
    const seq = []; const open = {}; let inSlot = 0, peak = 0, ok = true;
    for(let k=0;k<total;k++){
      const openCols = Object.keys(open).map(Number).filter(c=>open[c]>0);
      const fresh = remain.map((v,c)=>c).filter(c=>remain[c]>0 && !(open[c]>0));
      // mix 越大，越倾向开新色（篮子越挤）；篮满前强制补齐已开色
      const canOpen = fresh.length && inSlot + 3 <= LIMIT; // 开新色后最坏再补 2 个即可凑齐
      const pOpen = openCols.length ? Math.min(.85, .15 + P.mix*.14) : 1;
      let col;
      if(canOpen && (rnd() < pOpen || !openCols.length)) col = fresh[Math.floor(rnd()*fresh.length)];
      else if(openCols.length){ openCols.sort((a,b)=>open[b]-open[a]); col = (inSlot + 2 > LIMIT || rnd()<.5) ? openCols[0] : openCols[Math.floor(rnd()*openCols.length)]; }
      else { ok=false; break; }
      seq.push(col); remain[col]--; open[col]=(open[col]||0)+1; inSlot++;
      peak = Math.max(peak, inSlot);
      if(open[col]===3){ open[col]=0; inSlot-=3; }
    }
    if(!ok || peak > LIMIT){ if(typeof DBG!=="undefined") DBG.color++; continue; }
    order.forEach((t,i)=>{ t.color = seq[i]; });
    tiles.forEach(t => t.alive = true);
    return {tiles, P, attempt, peak};
  }
  throw new Error("genLevel failed " + lv);
}
if(typeof module !== "undefined") window.__m = {genLevel, isCovered, pushBack, LEVELS, SLOT_N, SLOT_MAX, ITEMS};

/* ====== 渲染 & 交互 ====== */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W=0, H=0, DPR=1, cell=0, ox=0, oy=0, slotY=0, slotW=0;
let tiles=[], P=null, slot=[], flying=[], fx=[], state="play", peekT=0, shakeT=0;
let tools={shake:1, back:1, peek:1}, revived=false, level=save.level;

/* ---------- 音效（WebAudio 合成） ---------- */
let AC=null;
function beep(f, d, type, vol, slide){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
    g.gain.setValueAtTime(vol||.15,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const SFX = {
  pick(){ beep(520,.08,"triangle",.12,780); },
  match(n){ beep(660+n*40,.12,"sine",.18); setTimeout(()=>beep(990+n*40,.18,"sine",.15),70); },
  warn(){ beep(140,.18,"square",.06); },
  lose(){ beep(400,.5,"sawtooth",.08,120); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.22,"triangle",.16),i*110)); },
  shake(){ beep(200,.3,"sawtooth",.05,600); }
};
function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

/* ---------- 布局 ---------- */
function layout(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  const r = cv.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!P) return;
  slotW = Math.min(W-24, 420);
  const slotH = slotW/SLOT_MAX;
  slotY = H - slotH - 14;
  // 筐（场景主体）：顶部留 70px 给黑猫与对白
  const top = 70, bot = slotY - 18;
  cell = Math.min(W - 16, (bot - top) * 1.15);          // 筐的宽度
  ox = (W - cell)/2; oy = top;
  BASKET = {x:ox, y:top, w:cell, h:bot-top};
}
let BASKET = {x:0,y:0,w:1,h:1};
window.addEventListener("resize", layout);

function tileRect(t){
  const s = t.r*2*BASKET.w;
  return {x:BASKET.x + t.x*BASKET.w - s/2, y:BASKET.y + t.y*BASKET.h - s/2 - t.z*2.5, s};
}
function slotRect(i){ const s=slotW/SLOT_MAX; return {x:(W-slotW)/2 + i*s, y:slotY, s}; }

/* ---------- 绘制线团 ---------- */
function drawYarn(x,y,s,col,dim,alpha){
  const C = COLORS[col], r = s*.42, cx=x+s/2, cy=y+s/2;
  ctx.save(); ctx.globalAlpha = alpha==null?1:alpha;
  // 底座方块（像抓大鹅的"格子物件"）
  ctx.fillStyle = dim ? "#cdbba4" : "#fff6e8";
  roundRect(x+s*.04,y+s*.04,s*.92,s*.92,s*.2); ctx.fill();
  ctx.strokeStyle = dim ? "#b09a80" : "#e0c7a6"; ctx.lineWidth=2; ctx.stroke();
  // 线团
  const g = ctx.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy,r);
  g.addColorStop(0, lighten(C.c,.35)); g.addColorStop(1, C.d);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = Math.max(1,s*.035);
  for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.ellipse(cx,cy,r*.95,r*(.3+Math.abs(k)*.12),k*.5,0,Math.PI); ctx.stroke(); }
  if(dim){ ctx.fillStyle="rgba(70,50,35,.45)"; roundRect(x+s*.04,y+s*.04,s*.92,s*.92,s*.2); ctx.fill(); }
  ctx.restore();
}
// 具体物件：彩色底托 + emoji 物件（按"形状"认，色弱也能玩），带旋转
function drawItem(x,y,s,col,dim,rot){
  const C = COLORS[col], cx=x+s/2, cy=y+s/2, r=s*.5;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot||0);
  ctx.fillStyle="rgba(60,35,15,.28)"; ctx.beginPath(); ctx.ellipse(r*.08,r*.16,r*.98,r*.9,0,0,7); ctx.fill();
  const g = ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);
  g.addColorStop(0, lighten(C.c,.55)); g.addColorStop(1, C.c);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r*.96,0,7); ctx.fill();
  ctx.strokeStyle=C.d; ctx.lineWidth=Math.max(1.5,s*.05); ctx.stroke();
  ctx.font = `${Math.round(s*.62)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(ITEMS[col], 0, s*.04);
  if(dim){ ctx.fillStyle="rgba(55,35,20,.55)"; ctx.beginPath(); ctx.arc(0,0,r*.98,0,7); ctx.fill(); }
  ctx.restore();
}
// 场景：木桌 + 竹筐 + 黑猫
function drawScene(now){
  const B=BASKET;
  // 木桌
  const tg=ctx.createLinearGradient(0,B.y+B.h*.3,0,H); tg.addColorStop(0,"#c99766"); tg.addColorStop(1,"#a8743f");
  ctx.fillStyle=tg; ctx.fillRect(0,B.y+B.h*.35,W,H);
  ctx.strokeStyle="rgba(90,50,20,.18)"; ctx.lineWidth=2;
  for(let i=0;i<6;i++){ const y=B.y+B.h*.4+i*28; ctx.beginPath(); ctx.moveTo(0,y); ctx.bezierCurveTo(W*.3,y+6,W*.7,y-6,W,y); ctx.stroke(); }
  // 竹筐（椭圆底 + 编织纹 + 前沿）
  const cx=B.x+B.w/2, cy=B.y+B.h*.55, rx=B.w*.52, ry=B.h*.5;
  ctx.fillStyle="#8a5a2c"; ctx.beginPath(); ctx.ellipse(cx,cy+8,rx+6,ry+8,0,0,7); ctx.fill();
  ctx.fillStyle="#d9a866"; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,7); ctx.clip();
  ctx.strokeStyle="rgba(120,75,30,.35)"; ctx.lineWidth=3;
  for(let i=-12;i<=12;i++){ ctx.beginPath(); ctx.moveTo(cx+i*18,cy-ry); ctx.lineTo(cx+i*18+30,cy+ry); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx+i*18,cy-ry); ctx.lineTo(cx+i*18-30,cy+ry); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle="#7a4c22"; ctx.lineWidth=7; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,7); ctx.stroke();
}
function drawCat(now){
  const x=W-62, y=8+Math.sin(now/400)*2, s=1;
  ctx.save(); ctx.translate(x,y);
  if(catMood==="lose"||catMood==="danger"){ ctx.translate(0,Math.sin(now/60)*2); }
  ctx.fillStyle="#2b2320";
  ctx.beginPath(); ctx.ellipse(30,40,22,18,0,0,7); ctx.fill();               // 身体
  ctx.beginPath(); ctx.arc(30,22,15,0,7); ctx.fill();                          // 头
  ctx.beginPath(); ctx.moveTo(17,14); ctx.lineTo(19,0); ctx.lineTo(27,10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(43,14); ctx.lineTo(41,0); ctx.lineTo(33,10); ctx.fill();
  ctx.strokeStyle="#2b2320"; ctx.lineWidth=5; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(50,46); ctx.quadraticCurveTo(66,40+Math.sin(now/200)*8,60,22); ctx.stroke();
  // 眼睛：得意眯眼 / 惊讶圆眼
  ctx.fillStyle="#f6d34a";
  if(catMood==="win"||catMood==="combo"){ ctx.beginPath(); ctx.arc(24,21,4.5,0,7); ctx.arc(36,21,4.5,0,7); ctx.fill(); ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(24,21,2,0,7); ctx.arc(36,21,2,0,7); ctx.fill(); }
  else { ctx.strokeStyle="#f6d34a"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(24,23,4,Math.PI*1.1,Math.PI*1.9); ctx.stroke(); ctx.beginPath(); ctx.arc(36,23,4,Math.PI*1.1,Math.PI*1.9); ctx.stroke(); }
  ctx.restore();
  // 对白气泡
  if(catSay && now < catSayUntil){
    ctx.font="bold 14px sans-serif"; const tw=ctx.measureText(catSay).width+20;
    const bx=Math.max(8,x-tw-4), by=14;
    ctx.fillStyle="#fff"; roundRect(bx,by,tw,30,14); ctx.fill(); ctx.strokeStyle="#2b2320"; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx+tw-2,by+12); ctx.lineTo(bx+tw+10,by+18); ctx.lineTo(bx+tw-2,by+22); ctx.fillStyle="#fff"; ctx.fill();
    ctx.fillStyle="#2b2320"; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillText(catSay,bx+10,by+15);
  }
  // 关卡标题（左上）
  ctx.fillStyle="#6b4428"; ctx.font="bold 15px sans-serif"; ctx.textAlign="left"; ctx.textBaseline="top";
  ctx.fillText("📜 "+TALES[(level-1)%TALES.length].t, 10, 16);
}
let catMood="start", catSay="", catSayUntil=0;
function cat(mood){ catMood=mood; const L=CAT_LINES[mood]; catSay=L[Math.floor(Math.random()*L.length)]; catSayUntil=performance.now()+2200; }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function lighten(hex,a){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; r=r+(255-r)*a|0; g=g+(255-g)*a|0; b=b+(255-b)*a|0; return `rgb(${r},${g},${b})`; }

/* ---------- 主循环绘制 ---------- */
function draw(now){
  ctx.clearRect(0,0,W,H);
  drawScene(now);
  let sx=0, sy=0;
  if(shakeT>0){ sx=(Math.random()-.5)*10*shakeT; sy=(Math.random()-.5)*6*shakeT; shakeT=Math.max(0,shakeT-.04); }
  ctx.save(); ctx.translate(sx,sy);
  // 堆叠
  const alive = tiles.filter(t=>t.alive).sort((a,b)=>a.z-b.z || a.y-b.y);
  for(const t of alive){
    const r = tileRect(t), cov = isCovered(t,tiles);
    drawItem(r.x,r.y,r.s,t.color, cov && peekT<=0, t.rot);
  }
  ctx.restore();
  drawCat(now);
  // 线篮
  const danger = slot.length >= slotCap-2;
  const s0 = slotRect(0);
  ctx.fillStyle = danger ? (Math.sin(now/120)>0 ? "#f6c2b4" : "#f0a996") : "#e9d3b4";
  roundRect(s0.x-8, slotY-8, slotW+16, s0.s+16, 16); ctx.fill();
  ctx.strokeStyle = danger ? "#d9534f" : "#c9a982"; ctx.lineWidth=3; ctx.stroke();
  for(let i=0;i<SLOT_MAX;i++){ const r=slotRect(i);
    if(i<slotCap){ ctx.fillStyle = (i===slotCap-1 && slotFlash>now) ? "#ffe08a" : "#fbf1e2"; roundRect(r.x+3,r.y+3,r.s-6,r.s-6,10); ctx.fill(); }
    else { ctx.fillStyle="rgba(120,90,60,.18)"; roundRect(r.x+3,r.y+3,r.s-6,r.s-6,10); ctx.fill();
      ctx.font=(r.s*.36)+"px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.globalAlpha=.55; ctx.fillText("🔒",r.x+r.s/2,r.y+r.s/2); ctx.globalAlpha=1; } }
  slot.forEach((it,i)=>{ const r=slotRect(i); it.dx += (r.x-it.dx)*.35; drawItem(it.dx+3,r.y+3,r.s-6,it.color,false,0); });
  // 飞行中
  for(let i=flying.length-1;i>=0;i--){
    const f=flying[i]; f.t=Math.min(1,f.t+.12);
    const e = 1-Math.pow(1-f.t,3), x=f.x0+(f.x1-f.x0)*e, y=f.y0+(f.y1-f.y0)*e - Math.sin(e*Math.PI)*40;
    const s=f.s0+(f.s1-f.s0)*e; drawItem(x,y,s,f.color,false,f.rot*(1-e));
    if(f.t>=1){ flying.splice(i,1); f.done(); }
  }
  // 特效粒子
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.25; p.life-=.03;
    ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1; if(p.life<=0) fx.splice(i,1); }
  if(peekT>0) peekT--;
  requestAnimationFrame(draw);
}

/* ---------- 交互 ---------- */
let busy=false;
cv.addEventListener("pointerdown", e=>{
  if(state!=="play" || busy) return;
  const b=cv.getBoundingClientRect(), x=e.clientX-b.left, y=e.clientY-b.top;
  const cand = tiles.filter(t=>t.alive).sort((a,b)=>b.z-a.z);
  for(const t of cand){
    const r=tileRect(t);
    const dx=x-(r.x+r.s/2), dy=y-(r.y+r.s/2);
    if(dx*dx+dy*dy <= (r.s*.5)*(r.s*.5)){
      if(isCovered(t,tiles)){ toast("被压住了，先拿上面的"); cat("start"); beep(180,.08,"square",.05); return; }
      pick(t,r); return;
    }
  }
});
function pick(t,r){
  if(slot.length + flying.length >= slotCap) return;
  t.alive=false; SFX.pick(); vibrate(8); tickOrders();
  // 同色插到同色后面（抓大鹅式归堆）
  let idx = slot.length; for(let i=slot.length-1;i>=0;i--) if(slot[i].color===t.color){ idx=i+1; break; }
  const target = slotRect(idx);
  busy=true;
  flying.push({x0:r.x,y0:r.y,s0:r.s,x1:target.x+3,y1:target.y+3,s1:target.s-6,color:t.color,rot:t.rot,t:0,done(){
    slot.splice(idx,0,{color:t.color, dx:target.x});
    busy=false; resolve();
  }});
  updateHUD();
}
function resolve(){
  // 三消
  const cnt={}; slot.forEach(s=>cnt[s.color]=(cnt[s.color]||0)+1);
  for(const c in cnt){ if(cnt[c]>=3){
    let removed=0; const rs=[];
    slot = slot.filter((s,i)=>{ if(s.color==c && removed<3){ removed++; rs.push(slotRect(i)); return false; } return true; });
    rs.forEach(r=>burst(r.x+r.s/2,r.y+r.s/2,COLORS[c].c));
    deliver(c);
    combo++; SFX.match(combo); vibrate(20); if(combo>=2) cat("combo");
    if(combo>=2) toast(["","","连消 ×2！","手感火热 ×3！","停不下来 ×4！","织神附体 ×"+combo+"！"][Math.min(combo,5)]);
  }}
  if(!tiles.some(t=>t.alive) && !slot.length){ return setTimeout(win,350); }
  if(slot.length>=slotCap){ return setTimeout(lose,250); }
  if(slot.length>=slotCap-2){ SFX.warn(); vibrate(30); cat("danger"); }
  if(!Object.values(cnt).some(v=>v>=3)) combo=0;
  updateHUD();
}
let combo=0, slotCap=SLOT_N, slotFlash=0;
function burst(x,y,c){ for(let i=0;i<14;i++){ const a=Math.random()*7, v=2+Math.random()*4; fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:2+Math.random()*3,c,life:1}); } }

/* ---------- 道具 ---------- */
function useTool(k, fn){
  if(state!=="play" || busy) return;
  if(tools[k]>0){ tools[k]--; fn(); }
  else adPrompt("看个短视频，再拿 1 次「"+({shake:"抖篮",back:"退回",peek:"透视"}[k])+"」？", ()=>{ fn(); });

}
document.getElementById("tShake").onclick = ()=>useTool("shake", ()=>{

});
document.getElementById("tBack").onclick = ()=>useTool("back", ()=>{
  if(!slot.length){ tools.back++; return toast("篮子是空的"); }

function updateHUD(){

let toastT=0;
function toast(s){ const el=document.getElementById("toast"); el.textContent=s; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1300); }

/* ---------- 订单（浪漫餐厅式）：顾客排队点单 + 耐心值，三消收好的物件自动交付 ----------
   设计要点：筐总要清空，所以订单必须带"时效"才有决策 —— 每拿 1 件，所有客人耐心 -1；
   耐心耗尽客人生气离开（拿不到金币），换下一位。玩家要在"保命清篮"和"先做订单"间取舍。 */
const GUESTS = [
  {ico:"👵",n:"奶奶"},{ico:"👧",n:"小花"},{ico:"🧔",n:"木匠"},{ico:"👩‍🍳",n:"厨娘"},
  {ico:"🧙",n:"斗篷客"},{ico:"👮",n:"巡警"},{ico:"👴",n:"老邮差"}
];
let orders = [], orderDone = 0, orderLost = 0, coinsGot = 0, guestIdx = 0;

function remainCount(){ const h={}; tiles.forEach(t=>{ if(t.alive) h[t.color]=(h[t.color]||0)+1; }); slot.forEach(s=>h[s.color]=(h[s.color]||0)+1); return h; }
function newOrder(){
  const have = remainCount(), busyC = new Set(orders.filter(o=>!o.done&&!o.gone).flatMap(o=>o.need.map(x=>x.c)));
  const cols = Object.keys(have).map(Number).filter(c=>have[c]>=3 && !busyC.has(c)).sort(()=>Math.random()-.5);
  if(!cols.length) return null;
  const kinds = level<=2 ? 1 : (Math.random()<.45 && cols.length>1 ? 2 : 1);
  const need = cols.slice(0,kinds).map(c=>({c, want: Math.min(Math.floor(have[c]/3), Math.random()<.3?2:1), got:0}));
  const sets = need.reduce((s,x)=>s+x.want,0);
  const g = GUESTS[guestIdx++ % GUESTS.length];
  const pat = Math.round(sets*11 + 8 - Math.min(4, level*.4));  // 耐心 = 拿取次数（sim3 调参：11/8）
  return {g, need, done:false, gone:false, pat, max:pat, reward: 8 + sets*10};
}
function makeOrders(){
  orders=[]; orderDone=0; orderLost=0; coinsGot=0; guestIdx=level*2;
  const n = level===1 ? 1 : 2;
  for(let i=0;i<n;i++){ const o=newOrder(); if(o) orders.push(o); }
}
function refillOrders(){
  orders = orders.filter(o=>!o.done && !o.gone);
  const n = level===1 ? 1 : 2;
  while(orders.length < n){ const o=newOrder(); if(!o) break; orders.push(o); }
  renderOrders();
}
// 每拿一件：耐心 -1
function tickOrders(){
  let changed=false;
  for(const o of orders){ if(o.done||o.gone) continue; o.pat--; if(o.pat<=0){ o.gone=true; orderLost++; changed=true; toast(o.g.ico+" "+o.g.n+"等不及走了…"); beep(220,.25,"triangle",.1,150); } }
  renderOrders(); if(changed) setTimeout(refillOrders,700);
}
// 三消时：交给需要它的客人
function deliver(c){
  for(const o of orders){
    if(o.done||o.gone) continue;
    const n = o.need.find(x=>x.c==c && x.got<x.want); if(!n) continue;
    n.got++; beep(1046,.12,"triangle",.14);
    if(o.need.every(x=>x.got>=x.want)){
      o.done=true; orderDone++; coinsGot+=o.reward;
      [784,988,1318].forEach((f,k)=>setTimeout(()=>beep(f,.16,"triangle",.16),k*80));
      vibrate([15,30,15]);
      // 局内回报：每完成一单，线篮 +1 格（上限 SLOT_MAX）—— 让"做订单"从陷阱变成保命投资
      if(slotCap < SLOT_MAX){ slotCap++; slotFlash = performance.now()+1200; toast(o.g.ico+" "+o.g.n+"送你一格篮子！🧺+1 · 🪙+"+o.reward); }
      else toast(o.g.ico+" "+o.g.n+"：太谢谢啦！ 🪙+"+o.reward);
      setTimeout(refillOrders,700);
    }
    renderOrders(o); return true;
  }
  return false;
}
function renderOrders(hit){
  const el=document.getElementById("orders"); if(!el) return;
  el.innerHTML = orders.map(o=>{
    const p = Math.max(0,o.pat/o.max), col = p>.5?"#5fae6a":p>.25?"#f2b134":"#e85d5d";
    const face = o.done?"😊":o.gone?"😤":p<=.25?"😠":o.g.ico;
    return `<div class="ord${o.done?" done":""}${o.gone?" gone":""}${o===hit?" hit":""}">
      <span class="gst">${face}</span>
      <span class="body"><span class="need">${o.need.map(x=>`<span class="it">${ITEMS[x.c]}<b>${Math.min(x.got,x.want)*3}/${x.want*3}</b></span>`).join("")}</span>
      <span class="pat"><i style="width:${p*100}%;background:${col}"></i></span></span>
      <span class="rw">${o.done?"✅":o.gone?"❌":"🪙"+o.reward}</span></div>`; }).join("") || `<div class="ord done"><span class="gst">🌙</span><span class="body">今天没有客人了</span></div>`;
}

/* ---------- 流程：开局 / 胜 / 负 / 复活 / 广告占位 ---------- */
const mask=document.getElementById("mask"), card=document.getElementById("card");
function modal(html){ card.innerHTML=html; mask.classList.add("on"); }

function startLevel(lv){

function win(){
  state="win"; SFX.win(); vibrate([20,30,20,30,80]); cat("win");
  const gain = level===2 ? 3 : level===10 ? 4 : 1;
  const allOrd = orderLost===0 && orderDone>0;
  const bonus = allOrd ? 1 : 0;
  save.coins += coinsGot;
  save.stars += gain + bonus; const isNew = save.level===level; if(isNew) save.level = Math.min(LEVELS.length, level+1);

    <button class="btn blue" id="bDbl">▶ 看视频 · 星星翻倍</button>
    <button class="btn" id="bShop">去线铺修东西 🏠</button>
    ${level<LEVELS.length?`<button class="btn gray" id="bNext">下一关</button>`:`<p>Demo 共 10 关，感谢试玩！</p>`}
    ${level===2?`<button class="btn gray" id="bShareW">炫耀一下</button>`:""}`);

}

// 广告占位：模拟 1.5 秒激励视频（接微信 wx.createRewardedVideoAd 时替换此函数）
function fakeAd(onReward){
  modal(`<h2>📺 广告播放中…</h2><p>（Demo 占位，1.5 秒后发放奖励）</p>`);
  setTimeout(()=>{ closeModal(); onReward(); }, 1500);
}
function adPrompt(text, onReward){
  const prev = state; state="pause";
  modal(`<h2>🎁 道具用完啦</h2><p>${text}</p><button class="btn blue" id="bAd">▶ 看视频领取</button><button class="btn" id="bCoin">🪙 30 金币买 1 次（有 ${save.coins}）</button><button class="btn gray" id="bNo">算了</button>`);
  document.getElementById("bCoin").onclick = ()=>{ if(save.coins<30) return toast("金币不够，多做订单吧"); save.coins-=30; persist(); state=prev; closeModal(); onReward(); updateHUD(); };
  document.getElementById("bAd").onclick = ()=>fakeAd(()=>{ state=prev; onReward(); updateHUD(); });
  document.getElementById("bNo").onclick = ()=>{ state=prev; closeModal(); };
}
function share(text){
  const url = location.protocol.startsWith("http") ? location.href : "https://example.com/";
  try{ if(navigator.share){ navigator.share({title:"拾线铺", text, url}); return; } }catch(e){}
  try{ navigator.clipboard.writeText(text+" "+url); toast("已复制，去粘贴给朋友吧"); }catch(e){ toast(text); }
}

/* ---------- 线铺：修复 + 剧情（浪漫餐厅式元层） ---------- */
function openShop(){
  const prev = state; if(state==="play") state="pause";
  const nBought = save.bought.length;
  const next = SHOP.find((s,i)=>!save.bought.includes(i));
  const grid = SHOP.map((s,i)=>`<div class="${save.bought.includes(i)?"on":""}" title="${s.n}">${s.ico}</div>`).join("");
  const storyIdx = Math.floor(nBought/2) - 1;
  const story = storyIdx>=0 ? `<div class="story">${STORY[Math.min(storyIdx,STORY.length-1)]}</div>` : `<div class="story"><b>奶奶：</b>灰雾过后，铺子全褪了色。拿星星来，一件件修回来吧。</div>`;
  modal(`<h2>🏠 拾光线铺 <small style="font-size:13px">${nBought}/${SHOP.length}</small></h2>
    <div id="shop">${grid}</div>${story}
    ${next?`<button class="btn" id="bBuy">修复「${next.n}」 ⭐${next.cost}（有 ${save.stars}）</button>`:`<p>第一章全部修好啦！第二章敬请期待</p>`}
    <button class="btn gray" id="bBack">${prev==="win"?"下一关":"返回"}</button>`);
  const bb=document.getElementById("bBuy");
  if(bb) bb.onclick = ()=>{
    const i = SHOP.indexOf(next);
    if(save.stars < next.cost) return toast("星星不够，去过关吧～");
    save.stars -= next.cost; save.bought.push(i); persist(); updateHUD();
    [659,784,988].forEach((f,k)=>setTimeout(()=>beep(f,.15,"triangle",.14),k*90));
    const newStory = save.bought.length%2===0;
    openShop(); if(newStory) toast("📖 解锁新剧情！");
  };
  document.getElementById("bBack").onclick = ()=>{
    if(prev==="win" && level<LEVELS.length) return startLevel(level+1);
    if(prev==="win") return closeModal();
    state = prev==="pause"?"play":prev; closeModal();
  };
}

/* ---------- 启动 ---------- */
window.addEventListener("load", ()=>{ startLevel(save.level); requestAnimationFrame(draw); });


</script>
