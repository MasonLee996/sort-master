<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拾线铺 · Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#241206;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#4a3426;overflow:hidden}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:#241206}
canvas{display:block;width:100%;flex:1;touch-action:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:9px 12px 7px;font-weight:700;background:linear-gradient(#4a2c14,#331d0c);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pill{background:linear-gradient(#fffdf6,#f2ddb8);border:2px solid #c8912f;border-radius:20px;padding:4px 12px;font-size:14px;box-shadow:0 2px 0 #8a5a1e,inset 0 -2px 3px rgba(200,145,47,.18)}
.bar{display:flex;gap:12px;justify-content:center;align-items:center;padding:12px 0 14px;background:linear-gradient(#3a2210,#241206)}
.tool{position:relative;width:74px;height:78px;border-radius:20px;background:linear-gradient(#fffdf6,#eed9b2);border:2.5px solid #c8912f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 #7a4a1c,0 8px 14px rgba(0,0,0,.35)}
.tool small{font-size:12px;font-weight:800;color:#4a2e14}
.tool img{width:38px;height:38px;display:block;object-fit:contain}
.tool i{position:absolute;top:-7px;right:-7px;font-style:normal;background:linear-gradient(#f0564f,#b8281f);color:#fff;font-size:12px;font-weight:800;border-radius:11px;padding:1px 7px;border:2px solid #fff6e0}
.tool.ad i{background:linear-gradient(#5aa2e0,#2f6aa8)}
.tool:active{transform:translateY(3px);box-shadow:0 2px 0 #7a4a1c}
.mask{position:absolute;inset:0;background:rgba(60,40,25,.55);display:none;align-items:center;justify-content:center;z-index:10}
.mask.on{display:flex}
.card{width:84%;background:#fff8ee;border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-size:22px;margin-bottom:8px}
.card p{font-size:14px;line-height:1.6;margin:6px 0;color:#6b5040}
.btn{display:block;width:100%;margin-top:10px;padding:12px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:#e8834a;box-shadow:0 4px 0 #b8602e}
.btn.blue{background:#4a90d9;box-shadow:0 4px 0 #2f6aa8}
.btn.gray{background:#b9a690;box-shadow:0 4px 0 #8f7d68}
.btn:active{transform:translateY(2px)}
.story{background:#f3e3cc;border-radius:12px;padding:10px;margin-top:10px;text-align:left;font-size:13px;line-height:1.7}
.story b{color:#c0582a}
#shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
#shop div{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#e8e0d6;filter:grayscale(1);opacity:.45;transition:.4s}
#shop div.on{filter:none;opacity:1;background:#ffe9c7;transform:scale(1.05)}
#orders{display:flex;gap:8px;padding:2px 10px 0;min-height:52px}
.ord{flex:1;display:flex;align-items:center;gap:6px;background:#fff8ee;border:2px solid #e4cfb2;border-radius:14px;padding:4px 8px;transition:.25s}
.ord .gst{font-size:26px}
.ord .body{flex:1;display:flex;flex-direction:column;gap:3px}
.ord .need{display:flex;gap:6px;flex-wrap:wrap}
.ord .pat{height:5px;background:#eadbc6;border-radius:3px;overflow:hidden}
.ord .pat i{display:block;height:100%;transition:width .2s}
.ord.gone{opacity:.5;background:#f6dede;border-color:#e5a3a3}
.ord .it{font-size:20px;display:flex;align-items:center;gap:2px}
.ord .it b{font-size:12px;color:#8a6a50}
.ord .rw{font-size:12px;font-weight:700;color:#c0812a}
.ord.hit{transform:scale(1.06);border-color:#f2b134;background:#fff1c9}
.ord.done{opacity:.55;background:#e6f4e2;border-color:#9fd09a}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(60,40,25,.85);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span class="pill" id="lvTxt">第 1 关</span><span class="pill" id="leftTxt">剩 0</span><span class="pill">⭐ <b id="starTxt">0</b> · 💰 <b id="coinTxt">0</b></span></div>
  <canvas id="cv"></canvas>
  <div class="bar">
    <div class="tool" id="tShake"><img class="ico" id="iShake" alt="抖篮"><small>抖篮</small><i>1</i></div>
    <div class="tool" id="tBack"><img class="ico" id="iBack" alt="退回"><small>退回</small><i>1</i></div>
    <div class="tool" id="tPeek"><img class="ico" id="iPeek" alt="透视"><small>透视</small><i>1</i></div>
    <div class="tool" id="tShop"><img class="ico" id="iShop" alt="线铺"><small>线铺</small></div>
  </div>
  <div class="mask" id="mask"><div class="card" id="card"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/*__JS__*/
</script>
</body>
</html>
